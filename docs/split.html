const TARGET=S.target||6;

function isAllSel(){return selArr().length===S.ages.length;}
function multiSel(){return selArr().length>=2;}
function arCount(n,one,two,few,many){const m=n%100;

  if(m>=3&&m<=10)return n+' '+few; return n+' '+many;}

// تجميع كل مجموعة عبر الفئات المختارة (المجموع من الفئات المكتملة فقط)
function aggData(agesIn){
  const map={};
  agesIn.forEach(age=>{(S.byAge[age]||[]).forEach(g=>{
    const d=map[g.group]||(map[g.group]={region:g.region,obj:{}});
    d.region=g.region; d.obj[age]=g;});});
  return Object.keys(map).map(grp=>{
    const d=map[grp];
    const allAges=agesIn.filter(a=>a in d.obj);
    const compAges=allAges.filter(a=>d.obj[a].total>=TARGET);   // الفئات المكتملة
    // المدن والمجموع: من الفئات المكتملة فقط
    const cities={};
    compAges.forEach(a=>{d.obj[a].cities.forEach(c=>{cities[c.city]=(cities[c.city]||0)+c.n;});});
    // الأشرطة: كل الفئات الظاهرة (لبيان المكتمل والناقص)
    const ages={},agesCities={};
    allAges.forEach(a=>{ages[a]=d.obj[a].total; agesCities[a]=d.obj[a].cities.map(c=>c.city);});
    const cityArr=Object.entries(cities).sort((a,b)=>b[1]-a[1]).map(([city,n])=>({city,n}));
    const sig=a=>[...(agesCities[a]||[])].sort().join('،');
    const citiesVary=new Set(compAges.map(sig)).size>1;
    return {group:grp,region:d.region,total:cityArr.reduce((s,c)=>s+c.n,0),cities:cityArr,ages:ages,
            agesCities:agesCities,citiesVary:citiesVary,
            agesN:allAges.length,doneAges:compAges.length,
            allDone:compAges.length>0 && compAges.length===allAges.length};
  }).filter(g=>g.doneAges>0).sort((a,b)=>b.total-a.total);
}
function curData(){
  const a=selArr();
  if(a.length===1) return (S.byAge[a[0]]||[]).slice();   // فئة واحدة: عرض المدن
  return aggData(a);                                      // عدة فئات: تجميع
}
function regionOptions(){

  // لا تُحسب المجموعات غير المكتملة (أقل من ٥ فرق؛ وفي عدة فئات = مكتملة في فئة واحدة على الأقل)
  const keep=g=>isAll?(g.doneAges>=1):(g.total>=TARGET);
  let arr=curData().filter(keep);
  if(curRegion!=='الكل')arr=arr.filter(g=>g.region===curRegion);
  const done=arr.filter(isDone).length;
  const totTeams=arr.reduce((s,g)=>s+g.total,0);
  const cities=new Set(); arr.forEach(g=>g.cities.forEach(c=>cities.add(c.city)));
  document.getElementById('kpis').innerHTML=
    '<div class="kpi"><div class="n">'+arr.length+'</div><div class="l">عدد المجموعات</div></div>'+
    '<div class="kpi"><div class="n" style="color:#7ee0a0">'+done+'</div><div class="l">'+(isAll?'مكتملة في كل الفئات المختارة':'مجموعات مكتملة')+'</div></div>'+
    '<div class="kpi"><div class="n">'+totTeams+'</div><div class="l">مجموع الفِرَق</div></div>'+
    '<div class="kpi"><div class="n">'+cities.size+'</div><div class="l">عدد المدن</div></div>';
  // تجميع حسب المنطقة
  const R={},order=[];
  arr.forEach(g=>{if(!R[g.region]){R[g.region]=[];order.push(g.region);}R[g.region].push(g);});
  order.sort((a,b)=>R[b].reduce((s,g)=>s+g.total,0)-R[a].reduce((s,g)=>s+g.total,0));
  let html='';
  order.forEach(rg=>{
    const gs=R[rg]; const rt=gs.reduce((s,g)=>s+g.total,0), rd=gs.filter(isDone).length;
    html+='<div class="rhd">'+rg+' <span class="rt">— '+nTeam(rt)+' · '+nGroup(gs.length)+' ('+rd+'/'+gs.length+' مكتملة)</span></div>';
    gs.forEach(g=>{
      const ok=isDone(g);
      const stTxt=isAll
        ?(g.allDone?'مكتملة في كل الفئات المختارة':'مكتملة في '+g.doneAges+' من '+g.agesN+' '+nCat(g.agesN))
        :(ok?'مكتمل'+(g.total>TARGET?' (زائد '+(g.total-TARGET)+')':''):'باقٍ '+(TARGET-g.total)+' للوصول إلى '+TARGET);
      html+='<div class="gcard'+(ok?' done':'')+'"><div class="ghead"><b>'+g.group+'</b>'+
        '<span class="badge">'+nTeam(g.total)+'</span>'+
        '<span class="st '+(ok?'ok':'no')+'">'+stTxt+'</span>'+
        '<span class="muted">'+nCity(g.cities.length)+'</span></div>';
      const vary=isAll&&g.citiesVary;
      html+='<div class="cnames">🏙️ '+g.cities.map(c=>c.city).join('، ')+(vary?' <span class="varyx">(المدن تختلف حسب الفئة)</span>':'')+'</div>';
      if(isAll){
        // اعرض الفئات المكتملة فقط (المجموعة مكتملة فيها ≥ المطلوب)
        const ags=S.ages.filter(a=>g.ages[a]!=null && g.ages[a]>=TARGET);
        html+=ags.map(a=>{const n=g.ages[a];
          const ac=vary?'<div class="agc">'+(g.agesCities[a]||[]).join('، ')+'</div>':'';
          return '<div class="crow"><div class="cn">'+a+'</div><div class="v">'+nTeam(n)+'</div></div>'+ac;}).join('');
      } else {
        html+=g.cities.map(c=>'<div class="crow"><div class="cn">'+c.city+'</div><div class="v">'+nTeam(c.n)+'</div></div>').join('');
      }
      html+='</div>';
    });
  });
  document.getElementById('content').innerHTML=html||'<div class="muted">لا توجد بيانات.</div>';
}
render();
</script>
</body></html>
