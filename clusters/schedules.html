<style>
*{box-sizing:border-box} body{margin:0;font-family:'Tajawal',sans-serif;background:#04150e;color:#eafff3}
.top{background:#006C35;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.top img.logo{height:46px;width:auto;filter:brightness(0) invert(1)}
.top h1{font-size:19px;margin:0;font-weight:800}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.agebar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.agebtn{background:#0d3f2d;border:1px solid #1c6b49;color:#eafff3;border-radius:10px;padding:9px 18px;cursor:pointer;font-family:'Tajawal';font-size:15px;font-weight:800}
.agebtn.on{background:#ffd166;color:#04150e;border-color:#ffd166}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.card{background:#0d3f2d;border:1px solid #1c6b49;border-radius:12px;padding:12px 16px;flex:1;min-width:150px}
.card .l{color:#8fdcb4;font-size:12px} .card .v{font-size:18px;font-weight:800;margin-top:3px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#0d4b32;border:1px solid #1c7a52;color:#eafff3;border-radius:20px;padding:8px 18px;cursor:pointer;font-family:'Tajawal';font-size:14px;font-weight:700}
.tab.on{background:#ffd166;color:#04150e;border-color:#ffd166}
.panel{background:#0b2c1f;border:1px solid #14543a;border-radius:14px;padding:14px}
.sel{display:block;background:#0d3f2d;color:#eafff3;border:1px solid #1c6b49;border-radius:10px;padding:10px 14px;font-family:'Tajawal';font-weight:700;font-size:14px;width:100%;max-width:520px;margin-bottom:10px;cursor:pointer}
.sel option{background:#0b2c1f;color:#eafff3}
.sellbl{color:#8fdcb4;font-size:12px;font-weight:700;margin:6px 0 3px}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.rteam{background:#0d3f2d;border:1px solid #1c6b49;border-radius:8px;padding:5px 10px;font-size:12.5px}
.rteam b{color:#ffd166;margin-left:5px}
.subttl{color:#ffd166;font-weight:800;font-size:14px;margin:12px 0 4px}
h3.sec{color:#ffd166;font-size:15px;margin:16px 0 8px;border-bottom:1px solid #14543a;padding-bottom:5px}
.dayttl{color:#eafff3;font-weight:800;font-size:13px;margin:14px 0 6px;background:#0d4b32;border:1px solid #1c7a52;border-radius:8px;padding:5px 12px;display:inline-block}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:6px}
th,td{border:1px solid #14543a;padding:6px 8px;text-align:center}
th{background:#0d4b32;color:#eafff3;font-weight:700} td{background:#0a2418}
td.time{background:#0d3f2d;color:#ffd166;font-weight:700;white-space:nowrap}
td.rest{color:#6f9a86;font-style:italic;background:#08190f}
.mtch b{color:#bfe9d4}
.note{color:#ffcf8a;background:#3a2f00;border:1px solid #ffd16655;border-radius:8px;padding:8px 11px;font-size:12.5px;margin-top:8px}
.muted{color:#8fdcb4;font-size:13px}
.stbl{overflow-x:auto}
.hint{color:#8fdcb4;font-size:12.5px;margin:2px 0 12px}
.prin{display:flex;gap:12px;align-items:flex-start;background:#0d3f2d;border:1px solid #1c6b49;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.prin .pn{flex:0 0 32px;height:32px;border-radius:50%;background:#ffd166;color:#04150e;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.prin .pt{font-weight:800;font-size:14.5px;color:#eafff3;margin-bottom:3px}
.prin .pe{color:#bfe9d4;font-size:12.5px;line-height:1.7}

ر جديد جزئي بعد اكتمال الأدوار الكاملة، دون تكرار أي لقاء داخل المهرجان الواحد. وعدد المهرجانات واحد لكل المجموعات داخل البطولة الواحدة."}, {"p": "عدالة المواجهات (تساوٍ تام)", "e": "يُختار عدد الأدوار بأكبر قيمة يبقى معها (الأدوار × عدد الخصوم) أقل من أو يساوي 28 مباراة: 5 فرق ← 7 أدوار × 4 = 28؛ 6 فرق ← 5 أدوار × 5 = 25؛ 7 فرق ← 4 × 6 = 24؛ 8 فرق ← 4 × 7 = 28؛ 9 فرق ← 3 × 8 = 24؛ 11 فريقًا ← 2 × 10 = 20."}, {"p": "تقسيم المجموعات عند الأعداد الكبيرة", "e": "لكل مجموعة ملعب قانوني واحد (4 ملاعب مصغّرة)، وعدد الملاعب القانونية في البطولة لا يزيد على عدد مجموعاتها. لذلك تُقسّم الفرق التي تحتاج مجموعتها أكثر من 4 ملاعب مصغّرة إلى مجموعات فرعية بحيث يقترب ناتج (الأدوار × عدد الخصوم) من 28 مباراة دون تجاوزها، ولا تقل المجموعة عن 6 فرق، ويُفضل العدد الزوجي لإلغاء راحة 45 دقيقة. التقسيم المعتمد: 12 = 6 + 6، و13 = 6 + 7، و15 = 7 + 8، و16 = 8 + 8، و17 = 8 + 9، و22 = 11 + 11؛ وتبقى 5 و6 و7 و8 و9 و11 مجموعة واحدة. (الأعداد الفردية لا يمكن أن تخلو من مجموعة فردية واحدة على الأقل.)"}, {"p": "اكتمال الدورة قبل التكرار", "e": "يلتقي كل فريق بجميع خصومه في مجموعته مرة واحدة قبل أن يتكرر أي لقاء، ولا يتكرر لقاء الزوج نفسه داخل المهرجان الواحد إطلاقًا. وهذا متحقق في جميع المجموعات، ومنها المجموعات التي لا تنتهي فيها الدورة مع نهاية المهرجان (مجموعات 7 و11 مثلًا)، فتستمر الدورة من مهرجان إلى الذي يليه دون تكرار لأي لقاء قبل اكتمالها، مع الإبقاء على 4 مباريات لكل فريق في كل مهرجان."}, {"p": "عدالة توزيع الأوقات", "e": "لا يتكرّر على فريق بعينه أن يبدأ أوّل فترة كل يوم، ولا أن ينال راحة 30 دقيقة دائمًا. في المجموعات الزوجية تلعب كل الفرق في كل فترة فالعدالة تامة تلقائيًا. وفي المجموعات الفردية تُوزَّع الراحات ذات 30 دقيقة وأوقات البدء بالتناوب على الفرق قدر الإمكان، بحيث لا يزيد الفرق بين أي فريقين في عدد مرات راحة 30 دقيقة عن مرتين في الموسم (وعن مرة واحدة في مجموعة 7 فرق)، ويُعرض عدد الراحات لكل فريق في الجداول المساعدة الملحقة بكل ورقة."}]}, {"key": "u7", "label": "تحت 7", "settings": [["وقت بداية اليوم", "16:00:00"], ["مدة المباراة (دقيقة)", "15"], ["الفاصل بين المباريات (دقيقة)", المجموع (مثلاً: 3 أو 2 أو 6 مباريات في الأخير). ولا يُشترط عدد مباريات أدنى؛ فالأولوية لاكتمال الأدوار وللتوزيع المعتمد في ورقة ملخص البطولات. وتُستثنى مجموعة الـ11 فريقاً: لإكمال ثلاثة أدوار (30 مباراة) تلعب 4 مباريات في 6 مهرجانات ثم 6 مباريات في المهرجان الأخير، فيطول ذلك اليوم وحده."}, {"p": "الراحة 15 أو 30 دقيقة", "e": "يرتاح الفريق فترة أو فترتين بين مباراتين، أي راحة 15 أو 30 دقيقة فقط. لا يلعب أبداً في فترتين متتاليتين، ولا تزيد راحته على 30 دقيقة."}, {"p": "المجموعات ذات العدد الفردي", "e": "في المجموعة الفردية يجلس فريق أو أكثر في كل فترة، والأصل ألا تتجاوز الراحة 30 دقيقة. وتُستخدم مجموعة من 5 فرق في بطولة الـ5 فرق وحدها؛ ولتفادي أي راحة تفوق 30 دقيقة يمتد يومها إلى 10 فترات (4:00–6:30 م) بمباراة واحدة في كل فترة على ملعب مصغّر واحد (أما 8 أو 9 فترات فلا تكفي). فلا توجد أي راحة تبلغ 45 أو 60 دقيقة في الملف."}, {"p": "توزيع المجموعات على الفترات", "e": "لا تلعب كل المجموعات في كل فترة؛ تتوزّع المجموعات على الفترات بما يناسب عدد الملاعب، فتتشارك نفس الملاعب ويقصُر اليوم."}, {"p": "عدد الملاعب", "e": "عدد الملاعب مُحدّد لكل بطولة (موضح في عنوان كل ورقة)، ويُبنى الجدول بحيث لا يتجاوز عدد مباريات الفترة عدد الملاعب."}, {"p": "عدالة تكرار الأزواج", "e": "داخل المجموعة يلتقي كل زوج العدد نفسه من المرات بلا أي تفاوت (الفارق صفر)، لأن الجدول يُبنى من أدوار كاملة. ويظهر هذا العدد في عمود «لقاءات كل خصم (أدوار كاملة)» في ورقة ملخص البطولات، وفي جدول تكرار الأزواج أسفل كل ورقة. وقد يختلف العدد من مجموعة إلى أخرى داخل البطولة نفسها لاختلاف أحجام المجموعات."}, {"p": "تقسيم المجموعات", "e": "يُعتمد توزيع الفرق المدوّن في عمود «توزيع الفرق في المجموعات» بورقة ملخص البطولات، وتُبنى الجداول عليه مباشرة، وتُفضّل المجموعات المتقاربة في الحجم. ولا تُستخدم مجموعة من 5 فرق إلا في بطولة الـ5 فرق نفسها (لا تدخل في تقسيم أي بطولة أكبر)، ولا من 3 أو 4 فرق لأنّها تفرض لقاء الخصم مرتين في اليوم نفسه. وكلما كبرت المجموعة قلّ عدد الأدوار ومعه عدد المباريات."}, {"p": "الأوقات", "e": "كل الأوقات مشتقّة بصيغ من ورقة المدخلات: وقت البداية ومدة المباراة والفاصل بينها."}, {"p": "ترتيب مواجهة الخصوم", "e": "لا يلتقي الفريق خصماً مرة ثانية قبل أن يلاعب جميع فرق مجموعته مرة، ولا يلتقي الفريقان مرتين في اليوم نفسه، ولا يلعب الفريق مباراتين في الفترة الزمنية نفسها."}, {"p": "عدالة توزيع الفترات", "e": "تتغير فترات الفريق من يوم لآخر؛ فلا يبدأ فريق واحد أول اليوم دائماً ولا يتأخر آخره دائماً. ولا يستريح أي فريق مهرجاناً كاملاً داخل مهرجانات مجموعته؛ أما في البطولة متعددة المجموعات فالمجموعة التي تكمل أدوارها في 6 مهرجانات (مجموعتا الـ7 والـ9) تنتهي قبل المجموعات الأخرى ولا تلعب في المهرجان السابع."}, {"p": "عدم التنقل بين الملاعب القانونية", "e": "الملاعب القانونية غير متجاورة، فلا يستطيع الفريق الانتقال من ملعب قانوني إلى آخر خلال اليوم نفسه. لذلك يُبنى الجدول بحيث تبقى كل مجموعة داخل ملعب قانوني واحد طوال المهرجان (بحد أقصى 4 ملاعب مصغّرة داخله). وإذا استُخدم أكثر من ملعب قانوني وجب أن تنقسم البطولة إلى مجموعات مستقلة تماماً، كل مجموعة في ملعبها، ولا تتقاطع مبارياتها."}]}, {"key": "u9", "label": "تحت 9", "settings": [["وقت بداية اليوم", "16:00:00"], ["مدة المباراة (دقيقة)", "15"], ["الفاصل بين المباريات (دقيقة)", "0"], ["طول الفترة الكاملة (دقيقة)", "15"], ["عدد المهرجانات في الموسم", "7"], ["ملاعب مصغّرة داخل الملعب القانوني", "4"], ["عدد الحكام لكل ملعب مصغّر", "1"]], "summary": {"headers": ["عدد الفرق", "عدد المجموعات", "توزيع الفرق في المجموعات", "عدد الأدوار", "مباريات كل فريق في الموسم", "عدد المهرجانات", "توزيع مباريات الفريق على المهرجانات", "وقت البداية", "وقت النهاية (أطول يوم)", "مدة اليوم (أطول يوم)", "عدد الملاعب (5 ضد 5)", "عدد الملاعب القانونية"], "rows": [["5", "1", "5", "7", "28", "7", "4 مباريات في 7 مهرجانات (المجموع 28)", "4:00 م", "6:30 م", "02:30:00", "1", "1"], ["6", "1", "6", "5", "25", "6", "4 مباريات في 5 مهرجانات، ثم 5 مباريات في المهرجان الأخير (المجموع 25)", "4:00 م", "6:15 م", "02:15:00", "3", "1"], ["7", "1", "7", "4", "24", "6", "4 مباريات في 6 مهرجانات (المجموع 24)", "4:00 م", "6:30 م", "02:30:00", "2", "1"], ["8", "1", "8", "4", "28", "7", "4 مباريات في 7 مهرجانات (المجموع 28)", "4:00 م", "5:45 م", "01:45:00", "4", "1"], ع المعتمد في ورقة ملخص البطولات. وتُستثنى مجموعة الـ11 فريقاً: لإكمال ثلاثة أدوار (30 مباراة) تلعب 4 مباريات في 6 مهرجانات ثم 6 مباريات في المهرجان الأخير، فيطول ذلك اليوم وحده."}, {"p": "الراحة 15 أو 30 دقيقة", "e": "يرتاح الفريق فترة أو فترتين بين مباراتين، أي راحة 15 أو 30 دقيقة فقط. لا يلعب أبداً في فترتين متتاليتين، ولا تزيد راحته على 30 دقيقة."}, {"p": "المجموعات ذات العدد الفردي", "e": "في المجموعة الفردية يجلس فريق أو أكثر في كل فترة، والأصل ألا تتجاوز الراحة 30 دقيقة. وتُستخدم مجموعة من 5 فرق في بطولة الـ5 فرق وحدها؛ ولتفادي أي راحة تفوق 30 دقيقة يمتد يومها إلى 10 فترات (4:00–6:30 م) بمباراة واحدة في كل فترة على ملعب مصغّر واحد (أما 8 أو 9 فترات فلا تكفي). فلا توجد أي راحة تبلغ 45 أو 60 دقيقة في الملف."}, {"p": "توزيع المجموعات على الفترات", "e": "لا تلعب كل المجموعات في كل فترة؛ تتوزّع المجموعات على الفترات بما يناسب عدد الملاعب، فتتشارك نفس الملاعب ويقصُر اليوم."}, {"p": "عدد الملاعب", "e": "عدد الملاعب مُحدّد لكل بطولة (موضح في عنوان كل ورقة)، ويُبنى الجدول بحيث لا يتجاوز عدد مباريات الفترة عدد الملاعب."}, {"p": "عدالة تكرار الأزواج", "e": "داخل المجموعة يلتقي كل زوج العدد نفسه من المرات بلا أي تفاوت (الفارق صفر)، لأن الجدول يُبنى من أدوار كاملة. ويظهر هذا العدد في عمود «لقاءات كل خصم (أدوار كاملة)» في ورقة ملخص البطولات، وفي جدول تكرار الأزواج أسفل كل ورقة. وقد يختلف العدد من مجموعة إلى أخرى داخل البطولة نفسها لاختلاف أحجام المجموعات."}, {"p": "تقسيم المجموعات", "e": "يُعتمد توزيع الفرق المدوّن في عمود «توزيع الفرق في المجموعات» بورقة ملخص البطولات، وتُبنى الجداول عليه مباشرة، وتُفضّل المجموعات المتقاربة في الحجم. ولا تُستخدم مجموعة من 5 فرق إلا في بطولة الـ5 فرق نفسها (لا تدخل في تقسيم أي بطولة أكبر)، ولا من 3 أو 4 فرق لأنّها تفرض لقاء الخصم مرتين في اليوم نفسه. وكلما كبرت المجموعة قلّ عدد الأدوار ومعه عدد المباريات."}, {"p": "الأوقات", "e": "كل الأوقات مشتقّة بصيغ من ورقة المدخلات: وقت البداية ومدة المباراة والفاصل بينها."}, {"p": "ترتيب مواجهة الخصوم", "e": "لا يلتقي الفريق خصماً مرة ثانية قبل أن يلاعب جميع فرق مجموعته مرة، ولا يلتقي الفريقان مرتين في اليوم نفسه، ولا يلعب الفريق مباراتين في الفترة الزمنية نفسها."}, {"p": "عدالة توزيع الفترات", "e": "تتغير فترات الفريق من يوم لآخر؛ فلا يبدأ فريق واحد أول اليوم دائماً ولا يتأخر آخره دائماً. ولا يستريح أي فريق مهرجاناً كاملاً داخل مهرجانات مجموعته؛ أما في البطولة متعددة المجموعات فالمجموعة التي تكمل أدوارها في 6 مهرجانات (مجموعتا الـ7 والـ9) تنتهي قبل المجموعات الأخرى ولا تلعب في المهرجان السابع."}, {"p": "عدم التنقل بين الملاعب القانونية", "e": "الملاعب القانونية غير متجاورة، فلا يستطيع الفريق الانتقال من ملعب قانوني إلى آخر خلال اليوم نفسه. لذلك يُبنى الجدول بحيث تبقى كل مجموعة داخل ملعب قانوني واحد طوال المهرجان (بحد أقصى 4 ملاعب مصغّرة داخله). وإذا استُخدم أكثر من ملعب قانوني وجب أن تنقسم البطولة إلى مجموعات مستقلة تماماً، كل مجموعة في ملعبها، ولا تتقاطع مبارياتها."}]}, {"key": "u11", "label": "تحت 11", "settings": [["وقت بداية اليوم", "16:00:00"], ["مدة المباراة (دقيقة)", "70"], ["الفاصل/ترتيب الملعب (دقيقة)", "10"], ["طول الفترة الكاملة (دقيقة)", "80"], ["أقصى عدد فترات في اليوم", "3"], ["عدد ملاعب 7×7 داخل الملعب القانوني", "2"], ["عدد المباريات المستهدف للفريق", "20"], ["الحد الأدنى لعدد فرق المجموعة", "5"], ["أقصى حجم للمجموعة", "22"], ["سقف أيام البطولة", "23"], ["أقل عدد مباريات للفريق", "16"], ["من", "إلى"], ["1", "1"], ["2", "2"], ["3", "4"], ["5", "8"]], "summary": {"headers": ["عدد الفرق", "عدد المجموعات", "توزيع الفرق في المجموعات", "عدد الأدوار", "مباريات كل فريق (مخططة)", "نظام الإقصاء", "أيام الدوري", "أيام الإقصاء", "إجمالي الأيام (دوري + إقصاء)", "وقت البداية", "وقت النهاية", "عدد الملاعب (7 ضد 7)", "عدد الملاعب القانونية", "تحقق: أصغر مجموعة ≥ الحد", "تحقق: الأيام ≤ السقف", "تحقق: أقل مباريات ≥ الحد", "عدد مباريات البطولة الواحدة", "عدد المجموعات بهذا العدد"], "rows": [["5", "1", "5", "4", "16", "— (دوري فقط، البطل أول المجموعة)", "20", "0", "20", "4:00 م", "7:50 م", "1", "1", "✔ 5", "✔ 20", "✔ 16", "40", "3"], ["6", "1", "6", "4", "20", "— (دوري فقط، البطل أول المجموعة)", "20", "0", "20", "4:00 م", "7:50 م", "1", "1", "✔ 6", "✔ 20", "✔ 20", function gp(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function arCount(n,one,two,few,many){const m=n%100;if(n===1)return one;if(n===2)return two;

}

  if(!PR.length)return '<div class="muted">لا توجد مبادئ.</div>';
  let h='<h3 class="sec">المبادئ الأساسية لبناء الجداول</h3>';
  PR.forEach((p,i)=>{h+='<div class="prin"><div class="pn">'+(i+1)+'</div><div><div class="pt">'+esc(p.p)+'</div>'+
    (p.e?'<div class="pe">'+esc(p.e)+'</div>':'')+'</div></div>';});
  return h;}
// جدول ملخص فئة واحدة مع عمود «ملاعب (التسجيل)» للمقارنة
function summaryTable(a){
  const s=a.summary;if(!s.headers.length)return '<div class="muted">لا يوجد ملخص.</div>';
  const sizePitch={};a.groups.forEach(g=>{if(g.pitches&&!(g.size in sizePitch))sizePitch[g.size]=g.pitches;});
  let h='<div class="stbl"><table><tr>'+s.headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'<th>🏟️ ملاعب (التسجيل)</th></tr>';
  s.rows.forEach(r=>{const n=parseInt(String(r[0]).replace(/[^0-9]/g,''))||0;const rp=sizePitch[n];
    h+='<tr>'+s.headers.map((_,j)=>'<td'+(j===0?' class="time"':'')+'>'+esc(r[j]||'')+'</td>').join('')+
      '<td class="time">'+(rp||'—')+'</td></tr>';});
  h+='</table></div>';return h;}
function overviewPanel(){
  let h='<div class="hint">📋 ملخص البطولات لكل الفئات — اضغط اسم الفئة بالأعلى للدخول في تفاصيلها.</div>';
  D.ages.forEach(a=>{h+='<h3 class="sec">'+esc(a.label)+'</h3>'+summaryTable(a);});
  return h;}
const TABS=[['groups','المجموعات'],['tmpl','قوالب الجداول'],['summary','ملخص البطولات']];
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
  '<button class="tab'+(k===tab?' on':'')+'" data-k="'+k+'">'+l+'</button>').join('');
  document.querySelectorAll('#tabs .tab').forEach(b=>b.onclick=()=>{tab=b.dataset.k;render();});}
function groupsPanel(){
  const TARGET=6;
  const all=A().groups;
  // المكتملة = ٦ فرق فأكثر
  const complete=i=>all[i].size>=TARGET;
  const regions=[...new Set(all.filter((g,i)=>complete(i)).map(g=>g.region).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  let h='<div class="hint">💡 اختر المنطقة ثم المجموعة لعرض فرقها وجدولها. الفرق المرقّمة مؤقتة (ترتيب التسجيل). تُعرض المجموعات المكتملة (٦ فرق فأكثر) فقط.</div>';
  h+='<div class="sellbl">🗺️ المنطقة</div>';
  h+='<select id="rsel" class="sel"><option value=""'+(curRegion===''?' selected':'')+'>كل المناطق</option>'+
    regions.map(r=>'<option value="'+esc(r)+'"'+(curRegion===r?' selected':'')+'>'+esc(r)+'</option>').join('')+'</select>';
  const idx=all.map((g,i)=>i).filter(i=>complete(i)&&(!curRegion||all[i].region===curRegion));
  if(idx.indexOf(curG)<0){curG=idx.length?idx[0]:-1;curTeam=null;}
  h+='<div class="sellbl">🧩 المجموعة</div>';
  h+='<select id="gsel" class="sel">'+idx.map(i=>'<option value="'+i+'"'+(i===curG?' selected':'')+'>'+
    esc(all[i].group)+' — '+nTeam(all[i].size)+'</option>').join('')+'</select>';
  const g=(curG>=0)?all[curG]:null;
  if(g){
    h+='<h3 class="sec">'+esc(g.group)+' — '+nTeam(g.size)+(g.region?' · '+esc(g.region):'')+'</h3>';
    if(g.tmpl){
      const tmpl=A().templates[String(g.tmpl)];const subs=tmpl.subgroups||[];
      if(subs.length>1){
        h+='<div class="hint">هذه المجموعة مقسّمة إلى '+subs.length+' مجموعات فرعية، تلعب كل واحدة على ملاعبها:</div>';
        subs.forEach(sg=>{h+='<div class="subttl">المجموعة '+sg.label+'</div><div class="roster">'+
          sg.teams.map(n=>'<span class="rteam"><b>'+n+'</b>'+esc(g.teams[n-1]||('#'+n))+'</span>').join('')+'</div>';});
      }
      h+='<div class="hint">اختر فريقًا لعرض مبارياته فقط، أو «الجدول الكامل» للكل:</div>';
      h+='<select id="tsel" class="sel"><option value="-1"'+(curTeam===null?' selected':'')+'>📋 الجدول الكامل</option>'+
        g.teams.map((t,i)=>{const sl=subLabelOf(subs,i+1);return '<option value="'+i+'"'+(curTeam===i?' selected':'')+'>'+(i+1)+' — '+esc(t)+(sl?' (المجموعة '+sl+')':'')+'</option>';}).join('')+'</select>';
      if(curTeam!==null){const r=teamMatchesHTML(tmpl,g.teams,curTeam);const sl=subLabelOf(subs,curTeam+1);
        h+='<h3 class="sec">مباريات '+esc(g.teams[curTeam])+(sl?' (المجموعة '+sl+')':'')+' — '+nMatch(r.count)+'</h3>'+r.html;}
      else h+=renderTemplate(tmpl,g.teams);
    }else{
      h+='<div class="roster">'+g.teams.map((t,i)=>'<span class="rteam"><b>'+(i+1)+'</b>'+esc(t)+'</span>').join('')+'</div>';
      h+='<div class="note">لا يوجد قالب جدول جاهز لعدد '+nTeam(g.size)+' في ملف الجداول بعد — عُرضت قائمة الفرق فقط.</div>';
    }
  }
  return h;
}
function tmplPanel(){
  const sizes=Object.keys(A().templates).map(Number).sort((a,b)=>a-b);
  let h='<div class="hint">💡 قوالب الجداول حسب عدد الفرق (بالأرقام). تُطبَّق على أي مجموعة بنفس العدد.</div>';
  h+='<select id="tmsel" class="sel">'+sizes.map(s=>'<option value="'+s+'"'+(s===curT?' selected':'')+'>'+nTeam(s)+'</option>').join('')+'</select>';
  const t=A().templates[String(curT)];
  if(t){const subs=t.subgroups||[];
    h+='<h3 class="sec">'+esc(t.title)+'</h3>';
    if(subs.length>1)h+='<div class="hint">'+subs.map(s=>'المجموعة '+s.label+': '+s.teams.length+' فرق').join(' · ')+'</div>';
    h+=renderTemplate(t,null);}
  return h;
}
function summaryPanel(){
  if(!A().summary.headers.length)return '<div class="muted">لا يوجد ملخص.</div>';
  return '<h3 class="sec">ملخص جداول المجموعات (حسب عدد الفرق)</h3>'+summaryTable(A());
}
function render(){
  renderAgebar();
  const p=document.getElementById('panel');
  if(curAge===-1){document.getElementById('tabs').innerHTML='';p.innerHTML=overviewPanel();return;}
  renderTabs();
  if(curAge===-2){document.getElementById('tabs').innerHTML='';p.innerHTML=principlesPanel();return;}
  p.innerHTML = tab==='groups'?groupsPanel() : tab==='tmpl'?tmplPanel() : summaryPanel();
  if(tab==='groups'){
    const rs=document.getElementById('rsel');if(rs)rs.onchange=()=>{curRegion=rs.value;curTeam=null;curG=-1;render();window.scrollTo(0,0);};
    const gs=document.getElementById('gsel');if(gs)gs.onchange=()=>{curG=+gs.value;curTeam=null;render();window.scrollTo(0,0);};
    const ts=document.getElementById('tsel');if(ts)ts.onchange=()=>{const v=+ts.value;curTeam=(v<0?null:v);render();};
  }
  if(tab==='tmpl'){const ms=document.getElementById('tmsel');if(ms)ms.onchange=()=>{curT=+ms.value;render();window.scrollTo(0,0);};}
}
render();
</script>
</body></html>
